name: Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  package-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and build installer
        shell: pwsh
        run: .\gradlew.bat :composeApp:desktopTest :composeApp:verifyDesktopRuntimeRestore :composeApp:packageReleaseMsi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: dccleaner-windows-installer-x64
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
